# XcodeGen manifest for the CCX macOS app (XcodeGen 2.48.0).
#
# Generate the project with `xcodegen generate` (or `scripts/build-and-run.sh`).
# The generated CCX.xcodeproj is not tracked.
#
# Signing: this is a public repository, so no personal Team ID lives here.
# Provide DEVELOPMENT_TEAM either on the xcodebuild command line
# (`DEVELOPMENT_TEAM=XXXXXXXXXX`, done automatically by scripts/build-and-run.sh)
# or through the untracked Config/LocalSigning.xcconfig
# (copy Config/LocalSigning.xcconfig.example). DEVELOPMENT_TEAM must NOT be set
# in the target settings below, because target settings override xcconfig values.

name: CCX

options:
  bundleIdPrefix: com.lizhichaox
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans

packages:
  CCXCore:
    path: Packages/CCXCore
  CCXAnnotate:
    path: Packages/CCXAnnotate
  CCXCapture:
    path: Packages/CCXCapture
  CCXPin:
    path: Packages/CCXPin
  CCXRecord:
    path: Packages/CCXRecord

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"

targets:
  CCX:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    configFiles:
      Debug: Config/CCX.xcconfig
      Release: Config/CCX.xcconfig
    sources:
      - path: App
    dependencies:
      - package: CCXCore
      - package: CCXAnnotate
      - package: CCXCapture
      - package: CCXPin
      - package: CCXRecord
    settings:
      base:
        PRODUCT_NAME: CCX
        PRODUCT_BUNDLE_IDENTIFIER: com.lizhichaox.ccx
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.9.4"
        CURRENT_PROJECT_VERSION: 23
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/CCX.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: NO
        DEAD_CODE_STRIPPING: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ARCHS: "$(ARCHS_STANDARD)"
          ONLY_ACTIVE_ARCH: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
    scheme:
      gatherCoverageData: false
